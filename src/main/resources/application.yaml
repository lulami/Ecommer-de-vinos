spring:
  application:
    name: vinico-backend

  # Base de datos H2 en memoria (desarrollo)
  datasource:
    url: jdbc:h2:mem:vinicodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Consola H2 (solo desarrollo)
  h2:
    console:
      enabled: true
      path: /h2-console

# Puerto del servidor
server:
  port: 8080

# JWT
jwt:
  secret: vinico-secret-key-must-be-at-least-32-characters-long-for-hs256
  expiration: 86400000  # 24 horas en ms

# Logging
logging:
  level:
    com.vinico: DEBUG
    org.springframework.security: DEBUG
